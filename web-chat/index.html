<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marveen Chat</title>
  <link rel="stylesheet" href="/chat/style.css">
</head>
<body>
  <!-- Login screen (shown while /chat-api/auth/me is 401) -->
  <div id="login" class="login hidden">
    <div class="login-card">
      <h1>Marveen Chat</h1>
      <p>Jelentkezz be a céges Google-fiókoddal.</p>
      <p id="login-error" class="login-error hidden"></p>
      <a class="login-btn" href="/chat-api/auth/login">Belépés Google-lel</a>
    </div>
  </div>

  <!-- App shell -->
  <div id="app" class="app hidden">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <button id="new-thread" class="primary">+ Új beszélgetés</button>
        <button id="sidebar-close" class="icon-btn" title="Bezárás"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <nav id="thread-list" class="thread-list"></nav>
      <div class="sidebar-foot">
        <button id="theme-toggle" class="icon-btn" title="Téma váltása"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
        <span id="me-email" class="me-email"></span>
        <button id="logout" class="link-btn">Kilépés</button>
      </div>
    </aside>
    <div id="backdrop" class="backdrop hidden"></div>
    <main class="main">
      <header class="topbar">
        <button id="sidebar-open" class="icon-btn" title="Szálak"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h2 id="thread-title">Marveen</h2>
        <div class="topbar-actions">
          <button id="rename-thread" class="icon-btn hidden" title="Átnevezés"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          <button id="close-thread" class="icon-btn hidden" title="Szál lezárása"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
        </div>
      </header>
      <div id="messages" class="messages">
        <div id="empty-state" class="empty-state">Válassz egy szálat, vagy indíts újat.</div>
      </div>
      <div id="status-bar" class="status-bar hidden"></div>
      <footer class="composer">
        <textarea id="input" rows="1" placeholder="Írj üzenetet…" disabled></textarea>
        <button id="send" class="primary" disabled>Küldés</button>
      </footer>
    </main>
  </div>

  <script src="/chat/app.js"></script>
</body>
</html>
