      tags: [messages]
      operationId: updateMessageStatus
      summary: Mark a message done or failed (executor callback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [done, failed]
                result:
                  type: string
                  description: Short result summary (first 500 chars stored)
            example:
              status: "done"
              result: "feat/openapi-spec pushed, 23ec40d"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Message not found or invalid status transition
          content:
