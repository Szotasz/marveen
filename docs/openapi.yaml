openapi: 3.1.0

info:
  title: Marveen Dashboard API
  version: 1.0.0
  description: |
    Internal REST API for the Marveen fleet dashboard and inter-agent communication.
    All endpoints require a Bearer token (`store/.dashboard-token`).

    **Tiers**
    - Tier 1 (full schema): core inter-agent endpoints — memories, messages, kanban,
      agents, skills, approvals, blackboard, daily-log, skill-usage.
    - Tier 2 (medium): schedules, ideas, artifacts, token-usage, connectors, recall, autonomy.
    - Tier 3 (x-internal): status checks, dashboard-internal routes, static assets.

servers:
  - url: http://localhost:3420/api/v1
    description: Canonical API base (v1)
  - url: http://localhost:3420/api
    description: Legacy API base (deprecated, Deprecation + Sunset headers returned)

security:
  - BearerAuth: []

tags:
  - name: memories
    description: Agent memory store (hot/warm/cold/shared tiers)
  - name: messages
    description: Inter-agent message queue
  - name: kanban
    description: Kanban board — cards, comments, labels, projects
  - name: agents
    description: Fleet agent management (CRUD, model, channels, process)
  - name: skills
    description: Skill filesystem read and usage tracking
  - name: approvals
    description: Human-in-the-loop approval requests
  - name: blackboard
    description: Fleet shared status board
  - name: daily-log
    description: Append-only per-agent daily journal
  - name: skill-usage
    description: Skill usage event log and statistics
  - name: schedules
    description: File-based scheduled task management
  - name: ideas
    description: Idea box
  - name: workspace
    description: Fleet-agent working documents (plans, briefs, reports, notes, binary)
  - name: artifacts
    description: DB-backed artifact store
  - name: token-usage
    description: LLM token consumption tracking
  - name: connectors
    description: External data source connectors
  - name: recall
    description: Consolidated recall (memory + daily-log) view
  - name: autonomy
    description: Autonomy level configuration per category
  - name: internal
    description: Dashboard-internal and status endpoints (x-internal)
  - name: admin-tenants
    description: B2B tenant management (requires admin:all role)
  - name: admin-partner-senders
    description: B2B partner sender allowlist management (requires admin:all role)

# ---------------------------------------------------------------------------
# Reusable components
# ---------------------------------------------------------------------------
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token stored in `store/.dashboard-token`

  schemas:
    DashboardUserPublic:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        tenant_id:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
          description: Optional contact email. Null if not set.
        display_name:
          type: string
          nullable: true
          description: Optional display name shown in the profile view. Null if not set.
        created_at:
          type: integer
        disabled:
          type: boolean

    UserProfile:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
          enum: [admin, agent, read_only, viewer]
        tenant_id:
          type: string
          nullable: true
        tenant_display_name:
          type: string
          nullable: true
        session_count:
          type: integer

    UserProfilePatch:
      type: object
      properties:
        username:
          type: string
        display_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        role:
          type: string
        tenant_id:
          type: string
          nullable: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: >-
            Machine-readable snake_case error token. Canonical values are listed
            in the enum; additional domain-specific tokens may appear in future
            API versions.
          enum:
            - not_found
            - required
            - invalid_value
            - forbidden
            - unauthorized
            - conflict
            - limit_exceeded
            - internal_error
            - parse_error
            - not_supported
            - timeout
            - disabled
            - managed_settings_missing
            - upstream_error
            - sender_not_in_allowlist
            - federation_disabled
            - unknown_query_parameter













        hint:
          type: string
          description: >-
            Optional human-readable debugging note. Present when the server has
            extra context that helps the caller fix the request (e.g. which
            parameter name the filter expects, or why a value was rejected).
            Clients must not rely on its exact text; treat it as informational.
        field:
          type: string
          description: >-
            Name of the request field that caused the validation failure.
            Present on 4xx validation errors when the problem can be attributed
            to a single input field.
      example:
        error: "required"
        field: "agent_id"

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]

    Memory:
      type: object
      required: [id, agent_id, content, category, created_at, accessed_at]
      properties:
        id:
          type: integer
        agent_id:
          type: string
          description: Owning agent id, or "import" for imported shadow rows
        content:
          type: string
        category:
          type: string
          enum: [hot, warm, cold, shared]
        keywords:
          type: [string, "null"]
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        accessed_at:
          type: integer
          description: Unix timestamp (seconds)
        updated_at:
          type: integer
          description: Unix timestamp (seconds)
        is_stale:
          type: boolean
          description: >
            Only included when agent filter active.
            True when the memory was updated after the agent's last read.
        created_label:
          type: string
          description: Human-readable created_at (localised)
        accessed_label:
          type: string
          description: Human-readable accessed_at (localised)
      example:
        id: 42
        agent_id: "agent-a"
        content: "Kanban board redesign merged 2026-08-22"
        category: "warm"
        keywords: "kanban, design"
        created_at: 1787400000
        accessed_at: 1787486000
        is_stale: false

    MemoryLink:
      type: object
      required: [src_id, dst_id, weight]
      properties:
        src_id:
          type: integer
        dst_id:
          type: integer
        weight:
          type: number
          minimum: 0
          maximum: 1
        created_at:
          type: integer

    AgentMessage:
      type: object
      required: [id, from_agent, to_agent, content, status, created_at]
      properties:
        id:
          type: integer
        from_agent:
          type: string
        to_agent:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [pending, delivered, done, failed]
        result:
          type: [string, "null"]
        origin_note:
          type: [string, "null"]
          maxLength: 120
        created_at:
          type: integer
        delivered_at:
          type: [integer, "null"]
        completed_at:
          type: [integer, "null"]
        trace_id:
          type: [string, "null"]
        span_id:
          type: [string, "null"]
      example:
        id: 3715
        from_agent: "agent-b"
        to_agent: "agent-a"
        content: "feat/zod-config-schema kész -- 23ec40d, 24 teszt zöld"
        status: "pending"
        result: null
        origin_note: null
        created_at: 1787487278

    KanbanCard:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
          description: 8-character hex id
        seq:
          type: integer
          description: Human-facing sequential number
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [planned, in_progress, waiting, done]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        assignee:
          type: [string, "null"]
        parent_id:
          type: [string, "null"]
        project:
          type: [string, "null"]
        created_at:
          type: integer
        updated_at:
          type: integer
        dispatched_at:
          type: [integer, "null"]
      example:
        id: "6df6d262"
        seq: 201
        title: "OpenAPI 3.1 spec elkészítése"
        status: "in_progress"
        priority: "high"
        assignee: "agent-b"

    KanbanComment:
      type: object
      required: [id, card_id, author, content, created_at]
      properties:
        id:
          type: integer
        card_id:
          type: string
        author:
          type: string
        content:
          type: string
        created_at:
          type: integer

    Approval:
      type: object
      required: [id, agent_id, category, action_description, status, created_at]
      properties:
        id:
          type: string
          description: UUID
        agent_id:
          type: string
        category:
          type: string
        action_description:
          type: string
        action_payload:
          type: [string, "null"]
          description: Optional JSON payload for the action
        status:
          type: string
          enum: [pending, approved, rejected, timeout]
        resolved_by:
          type: [string, "null"]
        timeout_at:
          type: [integer, "null"]
        created_at:
          type: integer
        resolved_at:
          type: [integer, "null"]
      example:
        id: "a1b2c3d4-e5f6-..."
        agent_id: "agent-b"
        category: "code_deploy"
        action_description: "Push feat/openapi-spec to origin"
        status: "pending"
        timeout_at: 1787490000
        created_at: 1787486000

    BlackboardRow:
      type: object
      required: [id, agent_id, status, summary, updated_at]
      properties:
        id:
          type: string
          description: 8-character hex id
        agent_id:
          type: string
        task_ref:
          type: [string, "null"]
          description: Kanban card id (optional reference)
        status:
          type: string
          enum: [active, done, blocked, stale, assigned]
        summary:
          type: string
          maxLength: 500
        updated_at:
          type: integer
      example:
        id: "b4cda374"
        agent_id: "agent-b"
        task_ref: "6df6d262"
        status: "active"
        summary: "feat/openapi-spec: írja az OpenAPI 3.1 spec-et"
        updated_at: 1787488514

    BlackboardRowWithSignal:
      allOf:
        - $ref: "#/components/schemas/BlackboardRow"
        - type: object
          properties:
            signal:
              type: [string, "null"]
              enum: ["a", "b", "ab", null]
              description: |
                Stale-signal computed at query time (no data is modified).
                "a" = agent sent a message recently but blackboard row was not updated (forgot to update).
                "b" = active row unchanged for longer than the configured threshold (completion signal may be lost).
                "ab" = both signals apply.
                null = no signal.
          example:
            id: "b4cda374"
            agent_id: "agent-a"
            task_ref: "card-001"
            status: "active"
            summary: "Working on task"
            updated_at: 1700000000
            signal: "b"

    BlackboardHistoryRow:
      type: object
      required: [id, agent_id, status, summary, created_at]
      properties:
        id:
          type: integer
          description: Auto-increment primary key
        agent_id:
          type: string
        task_ref:
          type: [string, "null"]
          description: Kanban card id at the time of the write
        status:
          type: string
          enum: [active, done, blocked, stale, assigned]
        summary:
          type: string
          maxLength: 500
        created_at:
          type: integer
          description: Unix timestamp of when this transition was recorded
      example:
        id: 1
        agent_id: "agent-a"
        task_ref: "task-001"
        status: "active"
        summary: "Started"
        created_at: 1700000000

    SkillUsageSummaryRow:
      type: object
      required: [skill_name, last_used_at, total_count, count_30d, count_90d]
      properties:
        skill_name:
          type: string
        last_used_at:
          type: integer
          description: Unix timestamp of most recent use
        total_count:
          type: integer
        count_30d:
          type: integer
        count_90d:
          type: integer

    DailyLog:
      type: object
      properties:
        agent_id:
          type: string
        date:
          type: string
          format: date
        entries:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              created_at:
                type: integer

    Tenant:
      type: object
      required: [id, display_name, created_at, disabled_at]
      properties:
        id:
          type: string
          description: "Tenant identifier — 3-63 chars, `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$`"
        display_name:
          type: string
          maxLength: 120
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        disabled_at:
          type: integer
          nullable: true
          description: Unix timestamp when disabled; null when active

    PartnerSender:
      type: object
      required: [sender_id, tenant_id, display_name, created_by, created_at, disabled_at]
      properties:
        sender_id:
          type: string
          description: "Sanitized sender identifier — `[a-zA-Z0-9_-]`, 1-63 chars"
        tenant_id:
          type: string
        display_name:
          type: string
        created_by:
          type: string
          description: Username of the admin who created this record
        created_at:
          type: integer
          description: Unix timestamp (seconds)
        disabled_at:
          type: integer
          nullable: true
          description: Unix timestamp when soft-deleted; null when active

    WorkspaceDoc:
      type: object
      required: [id, agent_id, tenant_id, title, content_type, type, size_bytes, created_at, updated_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
        tenant_id:
          type: string
        doc_key:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
          nullable: true
        content_type:
          type: string
          enum: [text, code, binary]
        type:
          type: string
          enum: [plan, brief, report, notes]
        task_ref:
          type: string
          nullable: true
        size_bytes:
          type: integer
        last_accessed_at:
          type: integer
          nullable: true
        created_at:
          type: integer
        updated_at:
          type: integer
        content_blob_b64:
          type: string
          nullable: true
          description: Base64-encoded binary content (binary docs only, GET /:id response)

    SaveWorkspaceDocInput:
      type: object
      required: [agent_id, title, content_type, type]
      properties:
        agent_id:
          type: string
        doc_key:
          type: string
          nullable: true
          description: If provided, upserts on (agent_id, doc_key)
        title:
          type: string
        content:
          type: string
          nullable: true
        content_type:
          type: string
          enum: [text, code, binary]
        type:
          type: string
          enum: [plan, brief, report, notes]
        task_ref:
          type: string
          nullable: true
        content_blob_b64:
          type: string
          description: Required for binary content_type; base64-encoded blob

# ---------------------------------------------------------------------------
# Paths — Tier 1
# ---------------------------------------------------------------------------
paths:

  # ---- Memories -----------------------------------------------------------

  /memories:
    get:
      tags: [memories]
      operationId: listMemories
      summary: List or search memories
      description: |
        Returns memories for an agent. When `q` is provided, performs hybrid
        vector + keyword search. Without `q`, returns recent memories for the
        agent (or the chat owner when `agent` is omitted).
        Non-admin callers receive only memories within their own tenant scope.
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query (triggers hybrid search when present)
        - name: agent
          in: query
          schema:
            type: string
          description: Agent id filter (preferred over deprecated `agent_id`)
        - name: category
          in: query
          schema:
            type: string
            enum: [hot, warm, cold, shared]
          description: Filter by memory tier
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: mode
          in: query
          schema:
            type: string
            enum: [hybrid, keyword]
            default: hybrid
          description: Search mode (only applies when `q` is set)
        - name: tenant
          in: query
          schema:
            type: string
          description: "Admin only: narrow results to one tenant (omit to see fleet-default scope)"
      responses:
        "200":
          description: Memory list (gzip-compressed when Accept-Encoding includes gzip)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [memories]
      operationId: createMemory
      summary: Save a new memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                agent_id:
                  type: string
                  description: Defaults to MAIN_AGENT_ID when omitted
                content:
                  type: string
                  minLength: 1
                category:
                  type: string
                  enum: [hot, warm, cold, shared]
                  default: warm
                keywords:
                  type: string
                  description: Comma-separated keywords for keyword search
            example:
              agent_id: "agent-a"
              content: "Kanban board redesign shipped 2026-08-22"
              category: "warm"
              keywords: "kanban, design"
      responses:
        "200":
          description: Memory saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: integer
        "400":
          description: Missing content or invalid category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/stats:
    get:
      tags: [memories]
      operationId: getMemoryStats
      summary: Memory tier statistics
      responses:
        "200":
          description: Count per tier + total
          content:
            application/json:
              schema:
                type: object

  /memories/stale:
    get:
      tags: [memories]
      operationId: listStaleMemories
      summary: Memories updated since the agent last read them
      parameters:
        - name: agent_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of stale memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
        "400":
          description: agent_id required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/links:
    get:
      tags: [memories]
      operationId: listMemoryLinks
      summary: Memory graph edges for a set of memory ids or an agent
      parameters:
        - name: ids
          in: query
          schema:
            type: string
          description: Comma-separated memory ids
        - name: agent
          in: query
          schema:
            type: string
          description: Fetch all edges for the agent's top-500 memories
      responses:
        "200":
          description: Edge list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemoryLink"

  /memories/graph:
    get:
      tags: [memories]
      operationId: getMemoryGraph
      summary: Memory graph — nodes + edges (dashboard graph view)
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: weight_min
          in: query
          schema:
            type: number
            default: 0.75
            minimum: 0
            maximum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
            maximum: 500
      responses:
        "200":
          description: Graph payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                  edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryLink"
                  meta:
                    type: object

  /memories/graph/timeline:
    get:
      tags: [memories]
      operationId: getMemoryGraphTimeline
      summary: Temporal memory graph slice for the timeline scrubber
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: integer
          description: Start Unix timestamp
        - name: to
          in: query
          schema:
            type: integer
          description: End Unix timestamp (defaults to now)
        - name: weight_min
          in: query
          schema:
            type: number
            default: 0.75
      responses:
        "200":
          description: Nodes, edges, and timeline events
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      type: object
                  edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemoryLink"
                  events:
                    type: array
                    items:
                      type: object
                  time_range:
                    type: object
                    properties:
                      min_ts:
                        type: integer
                      max_ts:
                        type: integer
        "400":
          description: from > to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/read-event:
    post:
      tags: [memories]
      operationId: recordMemoryReadEvent
      summary: Record that an agent read one or more memories (explicit read-trace)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - description: Single read
                  type: object
                  required: [agent_id, memory_id]
                  properties:
                    agent_id:
                      type: string
                    memory_id:
                      type: integer
                    context:
                      type: string
                      enum: [heartbeat, search, direct]
                - description: Batch read
                  type: object
                  required: [reads]
                  properties:
                    reads:
                      type: array
                      items:
                        type: object
                        required: [agent_id, memory_id]
                        properties:
                          agent_id:
                            type: string
                          memory_id:
                            type: integer
                          context:
                            type: string
                            enum: [heartbeat, search, direct]
      responses:
        "200":
          description: Read event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/resort:
    post:
      tags: [memories]
      operationId: resortMemories
      summary: Run scheduled memory maintenance (tier re-sort + version prune)
      description: Idempotent. Called by the maintenance scheduled task.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                warm_to_cold_days:
                  type: integer
                cold_to_warm_days:
                  type: integer
                min_agents:
                  type: integer
                version_ttl_days:
                  type: integer
      responses:
        "200":
          description: Resort result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/OkResponse"
                  - type: object
        "500":
          description: Resort failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/import:
    post:
      tags: [memories]
      operationId: importMemories
      summary: Bulk-import memory chunks (AI-categorised when Ollama is available)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunks]
              properties:
                agent_id:
                  type: string
                chunks:
                  type: array
                  items:
                    type: string
                  minItems: 1
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  imported:
                    type: integer
                  stats:
                    type: object
                    properties:
                      hot:
                        type: integer
                      warm:
                        type: integer
                      cold:
                        type: integer
                      shared:
                        type: integer
        "400":
          description: No chunks provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /memories/backfill:
    post:
      tags: [memories]
      operationId: backfillMemoryEmbeddings
      summary: Backfill vector embeddings for memories that lack them
      responses:
        "200":
          description: Backfill complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  count:
