  # ---------------------------------------------------------------------------
  # Admin — B2B management (admin:all)
  # ---------------------------------------------------------------------------

  /admin/tenants:
    post:
      tags: [admin-tenants]
      operationId: createTenant
      summary: Create a tenant
      description: |
        Creates a new B2B tenant. Requires `admin:all` role.

        Tenant id rules: `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$` (3-63 chars).
        Reserved ids (`default`, `admin`, `system`, `root`) are always rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, display_name]
              properties:
                id:
                  type: string
                  description: "Tenant id — `^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$`"
                display_name:
                  type: string
                  maxLength: 120
            example:
              id: acme-corp
              display_name: Acme Corporation
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: "`invalid_value` or `required`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [admin-tenants]
      operationId: listTenants
      summary: List tenants
      description: Returns active tenants. Pass `include_disabled=true` to include disabled ones.
      parameters:
        - name: include_disabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tenant"
                  total:
                    type: integer

  /admin/tenants/{tenant_id}:
    patch:
      tags: [admin-tenants]
      operationId: updateTenant
      summary: Update a tenant
      description: |
        Partial update — at least one field required. The `default` tenant
        cannot be disabled (`cannot_disable_default_tenant`).
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  maxLength: 120
                disabled:
                  type: boolean
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: "`required`, `invalid_value`, or `not_supported`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [admin-tenants]
      operationId: deleteTenant
      summary: Hard-delete a tenant
      description: |
        Permanently deletes a tenant and all associated data (memories, artifacts,
        users, partner senders, device-key assignments). The `default` tenant
        cannot be deleted. Requires `admin:all` role.
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  tenant_id:
                    type: string
                  memories_deleted:
                    type: integer
        "403":
          description: "`forbidden` — cannot delete the default tenant"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/users:
    post:
      tags: [admin-tenants]
      operationId: createUser
      summary: Create a dashboard user
      description: Creates a scoped (tenant) or global admin user. Requires `admin:all` role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 64
                password:
                  type: string
                  minLength: 12
                role:
                  type: string
                  enum: [viewer, read_only, agent, admin]
                tenant_id:
                  type: string
                  nullable: true
                  description: "Required for non-admin roles; must be null for admin role."
                email:
                  type: string
                  nullable: true
                display_name:
                  type: string
                  nullable: true
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUserPublic"
        "400":
          description: "`invalid_value` or `required`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict` — username already exists"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [admin-tenants]
      operationId: listUsers
      summary: List dashboard users
      description: Returns dashboard users. Pass `tenant_id` to filter by tenant. Requires `admin:all` role.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
        - name: include_disabled
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DashboardUserPublic"
                  total:
                    type: integer

  /admin/users/{userId}:
    patch:
      tags: [admin-tenants]
      operationId: updateUser
      summary: Update a dashboard user
      description: |
        Partial update — at least one field required. Validates final state
        (merged submitted + existing) for role/tenant_id consistency.
        Requires `admin:all` role.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [viewer, read_only, agent, admin]
                tenant_id:
                  type: string
                  nullable: true
                password:
                  type: string
                  minLength: 12
                  description: Plain-text password; server hashes it.
                disabled:
                  type: boolean
                email:
                  type: string
                  nullable: true
                display_name:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUserPublic"
        "400":
          description: "`required` or `invalid_value`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "`forbidden` — self-disable or last-admin protection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [admin-tenants]
      operationId: deleteUser
      summary: Hard-delete a dashboard user
      description: |
        Permanently removes the user. Cannot delete your own account or the
        last active admin. Requires `admin:all` role.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "403":
          description: "`forbidden` — self-delete or last-admin protection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/partner-senders:
    post:
      tags: [admin-partner-senders]
      operationId: createPartnerSender
      summary: Register a partner sender
      description: |
        Adds a sender id to the tenant allowlist. The `sender_id` is sanitized
        before storage (kept chars: `[a-zA-Z0-9_-]`, max 63 chars after sanitization).

        Two 409 cases:
        - `conflict` with `hint: "sender_id_is_fleet_agent"` — the id collides with a registered fleet
          agent name; pick a different sender id.
        - `conflict` with `hint: "partner_sender_already_exists"` — an active or soft-disabled record
          already exists for this `(sender_id, tenant_id)` pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sender_id, tenant_id]
              properties:
                sender_id:
                  type: string
                  description: "`[a-zA-Z0-9_-]`, 1-63 chars"
                tenant_id:
                  type: string
                display_name:
                  type: string
            example:
              sender_id: acme-bot
              tenant_id: acme-corp
              display_name: Acme Integration Bot
      responses:
        "201":
          description: Partner sender created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerSender"
        "400":
          description: "`invalid_value`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` (tenant does not exist or is disabled)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [admin-partner-senders]
      operationId: listPartnerSenders
      summary: List partner senders
      description: |
        Returns all partner senders. Filter by tenant with `?tenant_id=<id>`.
        Includes both active and soft-disabled records.
      parameters:
        - name: tenant_id
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Partner sender list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PartnerSender"
                  total:
                    type: integer

  /admin/partner-senders/{sender_id}:
    delete:
      tags: [admin-partner-senders]
      operationId: disablePartnerSender
      summary: Disable a partner sender (soft-delete)
      description: |
        Sets `disabled_at` on the record — the row is retained in the database.
        Requires `?tenant_id=<id>` query parameter.
      parameters:
        - name: sender_id
          in: path
          required: true
          schema:
            type: string
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
          description: Tenant the sender belongs to
      responses:
        "200":
          description: Sender disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: "`required` — missing `?tenant_id=` query parameter"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`not_found` — not found or already disabled"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/agent-availability:
    get:
      tags: [admin]
      operationId: getAgentAvailability
      summary: List agent availability for a tenant
      description: Returns enabled/disabled status for every known agent for the given tenant. Deny-by-default — an absent row means disabled.
      security:
        - bearerAuth: []
      parameters:
        - name: tenant_id
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent availability list
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, items]
                properties:
                  tenant_id:
                    type: string
                  items:
                    type: array
                    items:
                      type: object
                      required: [agent_id, enabled, updated_at]
                      properties:
                        agent_id:
                          type: string
                        enabled:
                          type: boolean
                        updated_at:
                          type: integer
        "400":
          description: "`bad_request` — missing tenant_id"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags: [admin]
      operationId: setAgentAvailability
      summary: Enable or disable an agent for a tenant
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, agent_id, enabled]
              properties:
                tenant_id:
                  type: string
                agent_id:
                  type: string
                enabled:
                  type: boolean
      responses:
        "200":
          description: Updated availability row
          content:
            application/json:
              schema:
                type: object
                required: [tenant_id, agent_id, enabled, updated_at]
                properties:
                  tenant_id:
                    type: string
                  agent_id:
                    type: string
                  enabled:
                    type: boolean
                  updated_at:
                    type: integer
        "400":
          description: "`bad_request`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admin/device-keys:
    get:
      tags: [admin]
      operationId: adminListDeviceKeys
      summary: List all device keys (admin)
      description: Returns all device keys including tenant assignment. Global admin only.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device key list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name, createdAt]
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        createdAt:
                          type: integer
                        lastUsedAt:
                          type: integer
                          nullable: true
                        expiresAt:
                          type: integer
                          nullable: true
                        installId:
                          type: string
                          nullable: true
                        tenantId:
                          type: string
                          nullable: true

  /admin/device-keys/{id}:
    patch:
      tags: [admin]
      operationId: assignDeviceKeyTenant
      summary: Assign or clear the tenant of a device key
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id]
              properties:
                tenant_id:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Updated device key info
          content:
            application/json:
              schema:
                type: object
                required: [id, tenantId]
                properties:
                  id:
                    type: integer
                  tenantId:
                    type: string
                    nullable: true
        "404":
          description: "`not_found`"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Tier 3 — internal / status (x-internal: true)
  # ---------------------------------------------------------------------------

  /status:
    get:
      tags: [internal]
      operationId: getStatus
      summary: Dashboard process and service status
      x-internal: true
      security: []
      responses:
        "200":
          description: Status object
          content:
            application/json:
              schema:
                type: object

  /overview:
    get:
      tags: [internal]
      operationId: getOverview
      summary: Dashboard overview panel data
      description: >
        Non-admin callers receive only memories and inter-agent messages within
        their own tenant scope. Admin callers see the global view; an optional
        `?tenant=<id>` query parameter narrows the result to a single tenant.
        Fleet-internal counters (token usage, pending approvals, stuck tasks,
        error spans) are always fleet-wide and unaffected by tenant scoping.
      x-internal: true
      parameters:
        - name: tenant
          in: query
          required: false
          description: Admin only -- narrow the overview to a single tenant ID.
          schema:
            type: string
      responses:
        "200":
          description: Overview payload
          content:
            application/json:
              schema:
                type: object
                required: [memories, unreadMessages, activity]
                properties:
                  memories:
                    type: object
                    description: Tenant-scoped memory counts. Present for all authenticated callers.
                    properties:
                      count: { type: integer }
                      categories: { type: integer }
                  unreadMessages:
                    type: integer
                    description: Tenant-scoped unread inter-agent messages.
                  activity:
                    type: array
                    description: Tenant-scoped recent activity feed (last 30 entries, 4h window).
                    items:
                      type: object
                      properties:
                        icon: { type: string }
                        text: { type: string }
                        at: { type: integer, description: Unix timestamp in milliseconds }
                        agent: { type: string }
                  agents:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: object
                    properties:
                      total: { type: integer }
                      running: { type: integer }
                      list: { type: array, items: { type: object } }
                  tasksToday:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  tasksYesterday:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  artifacts:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: object
                    properties:
                      count: { type: integer }
                  skills:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: object
                    properties:
                      count: { type: integer }
                      today: { type: integer }
                  tokensToday:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  costTodayUsd:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: number
                    format: double
                  pendingApprovals:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  errors4h:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer
                  stuckTasks:
                    x-admin-only: true
                    description: Admin-only. Omitted for non-admin callers.
                    type: integer

