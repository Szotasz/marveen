  # ---- Profile (self-service) ---------------------------------------------

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Get own profile
      description: |
        Returns the authenticated session user's own profile including display_name,
        email, role, tenant, and active session count. Only session-authenticated
        callers may use this endpoint; bearer-token callers receive 401.
      responses:
        "200":
          description: Profile data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        "401":
          description: Not authenticated or not a session caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [auth]
      operationId: patchMe
      summary: Update own profile
      description: |
        Updates the session user's own display_name and/or email.
        Role, tenant, and username cannot be changed via this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  nullable: true
                  maxLength: 128
                  description: Display name (null clears it)
                email:
                  type: string
                  nullable: true
                  format: email
                  description: Email address (null clears it)
      responses:
        "200":
          description: Updated profile fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfilePatch'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          description: Not authenticated or not a session caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
