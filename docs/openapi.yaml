  # ---- Messages -----------------------------------------------------------

  /messages:
    get:
      tags: [messages]
      operationId: listMessages
      summary: List agent messages
      description: |
        Returns messages filtered by agent, status, and pagination cursor.
        Only `agent`, `status`, `limit`, and `before` are accepted query parameters —
        unknown parameters return 400 to prevent silent filtering bugs.
      parameters:
        - name: agent
          in: query
          schema:
            type: string
          description: Agent mailbox filter (returns messages TO this agent)
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, delivered, done, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
        - name: before
          in: query
          schema:
            type: integer
          description: Pagination cursor — message id to fetch messages before
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentMessage"
        "400":
          description: Unknown query parameter
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      unknown:
                        type: array
                        items:
                          type: string
                      known:
                        type: array
                        items:
                          type: string
                      hint:
                        type: string

    post:
      tags: [messages]
      operationId: sendMessage
      summary: Send an inter-agent message
      description: |
        Creates a message in the queue for delivery to the target agent's session.
        The `from` field must be a registered fleet agent id (or the owner name).
        Federation addresses use slash notation: `"peer-system/agent-name"`.

        Side effect: when `assign: true` is set and the local recipient has no `active`
        or `blocked` blackboard row, a row with `status: "assigned"` is automatically
        opened. The summary is the first 100 characters of the message content. The
        agent's own `POST /api/blackboard` with `status: "active"` overwrites this row.
        Omitting `assign` or setting it to `false` produces no blackboard side effect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, content]
              properties:
                from:
                  type: string
                  description: Sender agent id (registered fleet agent)
                to:
                  type: string
                  description: Recipient agent id, or `"system/agent"` for federation
                content:
                  type: string
                  minLength: 1
                origin_note:
                  type: string
                  maxLength: 120
                  description: Optional attributability tag
                assign:
                  type: boolean
                  default: false
                  description: |
                    When true, opens an "assigned" blackboard row for the local recipient
                    if they have no active or blocked row. Use for deliberate task
                    delegation; omit for replies, notifications, and acknowledgements.
            example:
              from: "agent-b"
              to: "agent-a"
              content: "feat/openapi-spec kész, 23ec40d, Jónás tesztre vár"
      responses:
        "200":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentMessage"
        "400":
          description: |
            Missing required fields or invalid federated address.
            `error` is a stable snake_case code; human detail is in `hint`.
            Codes: `required`, `invalid_value`, `federation_disabled`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Sender not authorised.
            `error` is a stable snake_case code; human detail is in `hint`.
            Codes: `sender_reserved`, `federated_sender_not_allowed`,
            `sender_not_in_allowlist`, `unknown_sender`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages/threads:
    get:
      tags: [messages]
      operationId: listMessageThreads
      summary: Conversation thread list (sidebar view — one row per peer)
      description: Non-admin callers see only threads within their own tenant scope.
      responses:
