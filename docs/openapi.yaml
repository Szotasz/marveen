  # ---- Approvals ----------------------------------------------------------

  /approvals:
    get:
      tags: [approvals]
      operationId: listApprovals
      summary: List approval requests
      parameters:
        - name: agent
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected, timeout]
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

    post:
      tags: [approvals]
      operationId: createApproval
      summary: Create an approval request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, category, action_description]
              properties:
                agent_id:
                  type: string
                category:
                  type: string
                action_description:
                  type: string
                action_payload:
                  type: string
                  description: Optional JSON payload for the action
                timeout_seconds:
                  type: integer
                  description: Override the category default timeout
            example:
              agent_id: "agent-b"
              category: "code_deploy"
              action_description: "Push feat/openapi-spec branch to origin"
              timeout_seconds: 3600
      responses:
        "201":
          description: Approval request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /approvals/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: UUID
    get:
      tags: [approvals]
      operationId: getApproval
      summary: Poll approval status
      responses:
        "200":
          description: Approval object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    patch:
      tags: [approvals]
      operationId: resolveApproval
      summary: Resolve an approval (approve / reject / timeout)
      description: Self-approval guard — the requesting agent cannot approve its own request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolved_by]
              properties:
                status:
                  type: string
                  enum: [approved, rejected, timeout]
                resolved_by:
                  type: string
                telegram_message_id:
                  type: integer
            example:
              status: "approved"
              resolved_by: "agent-a"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Self-approval not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---- Blackboard ---------------------------------------------------------

  /blackboard:
    get:
      tags: [blackboard]
      operationId: listBlackboard
      summary: List fleet blackboard (last 10 rows, newest first)
      description: Each row includes a computed `signal` field indicating staleness. No data is modified.
      responses:
        "200":
          description: Blackboard rows with stale-signal annotations
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: "#/components/schemas/BlackboardRowWithSignal"
              example:
                - id: "b4cda374"
                  agent_id: "agent-b"
                  task_ref: "6df6d262"
                  status: "active"
                  summary: "feat/openapi-spec: írja a YAML-t"
                  updated_at: 1787488514
                  signal: null

    post:
      tags: [blackboard]
      operationId: upsertBlackboardEntry
      summary: Upsert agent status (one row per agent_id — creates or updates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, summary]
              properties:
                agent_id:
                  type: string
                summary:
                  type: string
                  maxLength: 500
                status:
                  type: string
                  enum: [active, done, blocked, stale, assigned]
                  default: active
                task_ref:
                  type: [string, "null"]
                  description: Kanban card id (optional)
            example:
              agent_id: "agent-b"
              task_ref: "6df6d262"
              status: "active"
              summary: "feat/openapi-spec: Tier 1 végpontok dokumentálása"
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  row:
                    $ref: "#/components/schemas/BlackboardRow"
        "400":
          description: Validation error (missing agent_id/summary, summary > 500 chars, invalid status)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /blackboard/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [blackboard]
      operationId: updateBlackboardEntry
      summary: Partially update a blackboard row by id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, done, blocked, stale, assigned]
                summary:
                  type: string
                  maxLength: 500
                task_ref:
                  type: [string, "null"]
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  row:
                    $ref: "#/components/schemas/BlackboardRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Row not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /blackboard/history:
    get:
      tags: [blackboard]
      operationId: listBlackboardHistory
      summary: List blackboard state-transition history (append-only audit trail)
      parameters:
        - name: agent_id
          in: query
          required: false
          schema:
            type: string
          description: Filter to a single agent
        - name: since
          in: query
          required: false
          schema:
            type: integer
          description: Return only entries with created_at >= this Unix timestamp (inclusive; paginating clients should use last_seen + 1 to avoid re-fetching the boundary row)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Maximum rows to return (capped at 200)
      responses:
        "200":
          description: History rows, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlackboardHistoryRow"
              example:
                - id: 1
                  agent_id: "agent-a"
                  task_ref: "task-001"
                  status: "active"
                  summary: "Started"
                  created_at: 1700000000
                - id: 2
                  agent_id: "agent-a"
                  task_ref: "task-001"
                  status: "done"
                  summary: "Finished"
                  created_at: 1700001000

  # ---- Daily Log ----------------------------------------------------------

  /daily-log:
    get:
      tags: [daily-log]
      operationId: getDailyLog
      summary: Read daily log for an agent and date
      parameters:
        - name: agent
          in: query
          schema:
            type: string
          description: Defaults to MAIN_AGENT_ID
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: ISO date (YYYY-MM-DD), defaults to today
      responses:
        "200":
          description: Daily log object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyLog"

    post:
      tags: [daily-log]
      operationId: appendDailyLog
      summary: Append an entry to the daily log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                agent_id:
                  type: string
                  description: Defaults to MAIN_AGENT_ID
                content:
                  type: string
                  minLength: 1
            example:
              agent_id: "agent-b"
              content: "## 14:10 -- feat/openapi-spec\nTier 1 végpontok kész, commit 23ec40d"
      responses:
        "200":
          description: Appended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Content required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /daily-log/dates:
    get:
      tags: [daily-log]
      operationId: listDailyLogDates
      summary: List dates for which the agent has daily-log entries
      parameters:
        - name: agent
          in: query
          schema:
            type: string
          description: Defaults to MAIN_AGENT_ID
      responses:
        "200":
          description: Date list (YYYY-MM-DD strings)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  format: date

  # ---- Skill Usage --------------------------------------------------------

  /skill-usage:
    get:
      tags: [skill-usage]
      operationId: listSkillUsage
      summary: Recent skill usage rows
      parameters:
        - name: agent_id
          in: query
          schema:
            type: string
        - name: skill_name
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: integer
          description: Unix timestamp — only rows after this
        - name: limit
          in: query
          schema:
            type: integer
            default: 500
      responses:
        "200":
          description: Usage row list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    agent_id:
                      type: string
                    skill_name:
                      type: string
                    trigger_type:
                      type: string
                      enum: [tool_call, skill_read]
                    session_id:
                      type: [string, "null"]
                    created_at:
                      type: integer

    post:
      tags: [skill-usage]
      operationId: recordSkillUsage
      summary: Record a skill usage event (called by PostToolUse hook)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, skill_name, trigger_type]
              properties:
                agent_id:
                  type: string
                skill_name:
                  type: string
                trigger_type:
                  type: string
                  enum: [tool_call, skill_read]
                session_id:
                  type: [string, "null"]
      responses:
        "200":
          description: Recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /skill-usage/summary:
    get:
      tags: [skill-usage]
      operationId: getSkillUsageSummary
      summary: Per-skill usage summary (last_used_at + 30d/90d/all-time counts)
      responses:
        "200":
          description: Summary list ordered by last_used_at DESC
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillUsageSummaryRow"
              example:
                - skill_name: "fleet-dashboard-api"
                  last_used_at: 1787461082
                  total_count: 134
                  count_30d: 45
                  count_90d: 120

  /skill-usage/stats:
    get:
