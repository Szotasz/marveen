name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Stub external binaries (claude, tmux) for module-load resolution
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/claude"; chmod +x "$HOME/bin/claude"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/tmux"; chmod +x "$HOME/bin/tmux"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Test
        run: npm test
