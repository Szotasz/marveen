name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: CSS design system guard
        run: bash scripts/css-guard.sh

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Check SDK is up to date
        run: |
          npm run generate:sdk
          git diff --exit-code src/generated/api.ts || \
            (echo "SDK out of sync -- run 'npm run generate:sdk' and commit src/generated/api.ts" && exit 1)

      - name: Stub external binaries (claude, tmux) for module-load resolution
        run: |
          mkdir -p "$HOME/bin"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/claude"; chmod +x "$HOME/bin/claude"
          printf '#!/bin/sh\necho stub\n' > "$HOME/bin/tmux"; chmod +x "$HOME/bin/tmux"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Test
        run: npm test

      - name: Python tests
        run: |
          fail=0
          for f in scripts/__tests__/*.test.py; do
            echo "== $f =="
            python3 "$f" || fail=1
          done
          exit $fail

      - name: Coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
