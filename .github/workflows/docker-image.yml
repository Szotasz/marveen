# HOSTINGERDOCKER1107: the Marveen container image.
#   build:   every PR and push that touches the image builds it for linux/amd64 and linux/arm64 (no push), and
#            runs the offline smoke (docker/ci-smoke.sh) on the amd64 image.
#   publish: a release tag (v*) pushes ghcr.io/szotasz/marveen:<version> and :latest, ONLY when the repository
#            variable MARVEEN_PUBLISH_IMAGE is 'true' (off until the live VPS trial passed and the maintainer turns it on).
#            After the push it pulls the image it just published, by digest and WITHOUT a registry login (the way an
#            install pulls it), and runs the same offline smoke on it: a private package or a broken push fails here.
# DOCKERGUIDEBUILD1108 (S1): every action is pinned to a full commit SHA, the version in the comment. This workflow
# holds packages: write on the publish job, so a moved tag of a third-party action must not reach it.
name: Docker image

on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'docker/**', 'docker-compose.yml', 'package.json', 'package-lock.json', '.github/workflows/docker-image.yml']
  push:
    branches: [develop, main]
    paths: ['Dockerfile', '.dockerignore', 'docker/**', 'docker-compose.yml', 'package.json', 'package-lock.json', '.github/workflows/docker-image.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build linux/amd64 + linux/arm64 (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image for the smoke
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marveen:ci
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Offline smoke (amd64)
        run: bash docker/ci-smoke.sh marveen:ci

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.MARVEEN_PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/szotasz/marveen
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
      # DOCKERGUIDEBUILD1108 (N1): the published image, as an install gets it. Logged out on purpose: a package that
      # stayed private (the first push of a new ghcr package can be) answers "denied" here instead of on a customer VPS.
      - name: Pull the published image anonymously, by digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "no digest from the push step: '$DIGEST'"; exit 1;; esac
          docker logout ghcr.io
          docker pull "ghcr.io/szotasz/marveen@$DIGEST"
          echo "published: ghcr.io/szotasz/marveen@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Offline smoke on the published image (amd64)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: bash docker/ci-smoke.sh "ghcr.io/szotasz/marveen@$DIGEST"
