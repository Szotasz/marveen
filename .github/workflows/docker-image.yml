# HOSTINGERDOCKER1107: the Marveen container image.
#   build:   every PR and push that touches the image builds it for linux/amd64 and linux/arm64 (no push), and
#            runs the offline smoke (docker/ci-smoke.sh) on the amd64 image.
#   publish: a release tag (v*) pushes ghcr.io/szotasz/marveen:<version> and :latest, ONLY when the repository
#            variable MARVEEN_PUBLISH_IMAGE is 'true' (off until the live VPS trial passed and the maintainer turns it on).
name: Docker image

on:
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'docker/**', 'docker-compose.yml', 'package.json', 'package-lock.json', '.github/workflows/docker-image.yml']
  push:
    branches: [develop, main]
    paths: ['Dockerfile', '.dockerignore', 'docker/**', 'docker-compose.yml', 'package.json', 'package-lock.json', '.github/workflows/docker-image.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64 + linux/arm64 (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load the amd64 image for the smoke
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: marveen:ci
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
      - name: Offline smoke (amd64)
        run: bash docker/ci-smoke.sh marveen:ci

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.MARVEEN_PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/szotasz/marveen
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: MARVEEN_COMMIT=${{ github.sha }}
          cache-from: type=gha
