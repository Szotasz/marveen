; HOSTINGERDOCKER1107: the systemd user units of the Linux install (install-linux.sh <id>-dashboard, <id>-channels and
; the two timers), as supervisor programs. scripts/channels.sh runs DIRECTLY (no wrapper): the dashboard starts its own
; copy when ps shows none (src/web/channels-supervisor.ts), so the process must be visible under its own path.

[supervisord]
nodaemon=true
user=marveen
logfile=/opt/marveen/store/supervisord.log
logfile_maxbytes=5MB
logfile_backups=2
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; <id>-dashboard.service: Restart=on-failure, RestartSec=5
[program:dashboard]
directory=/opt/marveen
command=/bin/bash -c 'scripts/ensure-native-modules.sh && exec node dist/index.js'
environment=USER="marveen"
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=1000000
stopsignal=TERM
stopwaitsecs=20
stopasgroup=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; <id>-channels.service: Restart=always, RestartSec=10. KillMode=process there keeps the shared tmux server alive:
; stopasgroup/killasgroup stay false so a stop of channels.sh does not take the tmux server with it.
[program:channels]
directory=/opt/marveen
command=/opt/marveen/scripts/channels.sh
environment=USER="marveen"
autorestart=true
startsecs=10
startretries=1000000
stopasgroup=false
killasgroup=false
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; <id>-channel-keepalive-probe.timer: every 3 minutes
[program:keepalive-probe]
directory=/opt/marveen
command=/bin/bash -c 'while :; do sleep 180; bash scripts/channel-keepalive-probe.sh >/dev/null 2>&1; done'
environment=USER="marveen"
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; <id>-main-inbox-observer.timer: every 5 minutes
[program:inbox-observer]
directory=/opt/marveen
command=/bin/bash -c 'while :; do sleep 300; bash scripts/main-inbox-observer.sh >/dev/null 2>&1; done'
environment=USER="marveen"
autorestart=true
stdout_logfile=/dev/null
redirect_stderr=true

; Once: the dashboard link, as the installer prints it at its end (the dashboard prints it only on a terminal).
[program:dashboard-link]
directory=/opt/marveen
command=/opt/marveen-docker/dashboard-link.sh
autorestart=false
startsecs=0
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
