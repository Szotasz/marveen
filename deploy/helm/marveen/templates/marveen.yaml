apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ .Release.Name }}-store }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.persistence.store.size }} } }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: {{ .Release.Name }}-claude-home }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .Values.persistence.claudeHome.size }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ .Release.Name }} }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app: {{ .Release.Name }} } }
    spec:
      securityContext: { fsGroup: 1000 }
      containers:
        - name: marveen
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 3420 }]
          env:
            - { name: WEB_HOST, value: "0.0.0.0" }
            {{- range $k, $v := .Values.env }}
            - { name: {{ $k }}, value: {{ $v | quote }} }
            {{- end }}
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            tcpSocket: { port: 3420 }
            periodSeconds: 5
          volumeMounts:
            - { name: store, mountPath: /app/store }
            - { name: claude-home, mountPath: /home/node/.claude }
            {{- if .Values.existingSecret }}
            - { name: config, mountPath: /config, readOnly: true }
            {{- end }}
      volumes:
        - name: store
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-store }
        - name: claude-home
          persistentVolumeClaim: { claimName: {{ .Release.Name }}-claude-home }
        {{- if .Values.existingSecret }}
        - name: config
          secret:
            secretName: {{ .Values.existingSecret }}
            optional: true
            items: [{ key: env, path: env }]
        {{- end }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ .Release.Name }} }
spec:
  type: NodePort
  selector: { app: {{ .Release.Name }} }
  ports:
    - { port: 3420, targetPort: 3420, nodePort: {{ .Values.service.nodePort }} }
